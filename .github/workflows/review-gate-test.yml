name: Teste do portão da revisão editorial

# Roda só o script do portão sobre fixtures (sem TTS, sem segredos, sem publicar nada).
on:
  push:
    paths:
      - "scripts/review_gate.py"
      - "tests/review-gate/**"
      - ".github/workflows/review-gate-test.yml"
  pull_request:
    paths:
      - "scripts/review_gate.py"
      - "tests/review-gate/**"
      - ".github/workflows/review-gate-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Casos do portão (A pendente, sem A, A sob demanda, review ausente)
        run: |
          fail=0
          check() { # dir esperado
            rc=0; python3 scripts/review_gate.py "tests/review-gate/$1" || rc=$?
            if [ "$rc" = "$2" ]; then echo "OK   $1: exit $rc (esperado $2)"
            else echo "FALHA $1: exit $rc (esperado $2)"; fail=1; fi
          }
          check a-pendente 10
          check sem-a 0
          check a-sob-demanda 0
          check ausente 20
          exit $fail
