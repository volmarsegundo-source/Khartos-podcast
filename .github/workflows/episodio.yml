name: Gerar episódio e publicar feed

on:
  push:
    branches: [main]
    paths: ["episodes/**", "scripts/**", "assets/**", ".github/workflows/episodio.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: khartos-podcast
  cancel-in-progress: false

env:
  KEEP_EPISODES: 12   # quantos episódios ficam no feed (o arquivo completo fica nas Releases)

jobs:
  build:
    # Fixado em 24.04: em 11/11/2026 o ubuntu-latest (26.04) não resolvia security.ubuntu.com e o apt travava.
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ffmpeg
        timeout-minutes: 8
        run: |
          getent hosts archive.ubuntu.com security.ubuntu.com texttospeech.googleapis.com || echo "aviso: DNS não resolveu algum host"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -qq ffmpeg

      - name: Gerar áudio dos episódios novos
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          TTS_VOICE_MARCO: ${{ vars.TTS_VOICE_MARCO }}
          TTS_VOICE_NINA: ${{ vars.TTS_VOICE_NINA }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          TTS_RATE: ${{ vars.TTS_RATE }}
        run: |
          set -euo pipefail
          removed=0
          for dir in episodes/*/; do
            ep=$(basename "$dir")
            tag="ep-$ep"
            [ -f "$dir/roteiro.txt" ] || continue
            # Marcador "refazer": apaga a Release e a tag e gera o episódio de novo
            if [ -f "$dir/refazer" ]; then
              echo "refazendo: $tag"
              gh release delete "$tag" --cleanup-tag --yes || true
              git rm -q "$dir/refazer"; removed=1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "já publicado: $tag"; continue
            fi
            python3 scripts/tts.py "$dir"
            title=$(head -n1 "$dir/notas.md" 2>/dev/null | sed 's/^#\s*//')
            [ -n "$title" ] || title="Rota da Semana — Khartos — $ep"
            tail -n +2 "$dir/notas.md" > /tmp/notas.md 2>/dev/null || echo "" > /tmp/notas.md
            cp "$dir/episodio.mp3" "/tmp/$tag.mp3"
            gh release create "$tag" "/tmp/$tag.mp3" --title "$title" --notes-file /tmp/notas.md
          done
          if [ "$removed" = 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Remover marcador refazer"
            git pull -q --rebase origin main && git push -q origin HEAD:main
          fi

      - name: Montar site do podcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/audio
          cp assets/cover.png site/cover.png
          echo "[" > releases.json; first=1
          for tag in $(gh release list --limit "$KEEP_EPISODES" --json tagName --jq '.[].tagName'); do
            gh release download "$tag" --pattern "$tag.mp3" --dir site/audio --clobber
            [ $first -eq 1 ] || echo "," >> releases.json; first=0
            gh release view "$tag" --json tagName,name,body,publishedAt >> releases.json
          done
          echo "]" >> releases.json
          # Domínio próprio (GitHub Pages › Custom domain); o endereço github.io não aparece no site nem no feed
          base="https://podcast.khartos.com"
          python3 scripts/build_feed.py releases.json site "$base"

      # A newsletter nunca trava a publicação do episódio (continue-on-error). Só edições aprovadas
      # (arquivo episodes/AAAA-MM-DD/newsletter.aprovada) vão para /newsletter/AAAA-MM-DD/; os rascunhos da revista vão para
      # /newsletter/preview/AAAA-MM-DD/ (faixa de rascunho, noindex) e também ficam no artefato.
      # Edições com revista.json saem da revista (web, PDF e e-mail de capa); as demais, do newsletter.md.
      - name: Gerar newsletter e revista
        continue-on-error: true
        env:
          NEWSLETTER_ROOT: ${{ vars.NEWSLETTER_ROOT }}   # ex.: https://newsletter.khartos.com (ver docs/newsletter-dominio.md)
        run: |
          python3 -m pip install --quiet pillow
          python3 scripts/fetch_revista_photos.py episodes || true
          python3 scripts/build_newsletter.py episodes --out newsletter-out --site site
          python3 scripts/build_revista.py episodes --out newsletter-out --site site --pdf

      - name: Guardar HTML e texto da newsletter (rascunhos incluídos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newsletter
          path: newsletter-out
          retention-days: 30
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
