name: Amostras de voz (Marco Polo)

on:
  push:
    branches: [main]
    paths: [".github/workflows/amostras-voz.yml"]

permissions:
  contents: write

jobs:
  limpar:
    runs-on: ubuntu-latest
    steps:
      - name: Apagar a Release de amostras
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete amostras-voz --cleanup-tag -y --repo "${{ github.repository }}" || true
